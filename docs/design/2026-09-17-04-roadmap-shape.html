<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CodeWiki 里程碑编排</title>
<style>
:root{--ink:#15231e;--muted:#617069;--paper:#f4f0e6;--card:#fffdf8;--line:#d7d1c3;--green:#145f44;--blue:#275c89;--amber:#a9681d;--red:#a34439}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#dce9e0,transparent 30%),var(--paper);color:var(--ink);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}main{width:min(1180px,calc(100% - 36px));margin:auto;padding:42px 0 70px}.eyebrow{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--green);font-weight:800}h1{font:700 clamp(34px,5vw,58px)/1.05 Georgia,"Noto Serif SC",serif;margin:10px 0 12px}.lead{font-size:18px;line-height:1.7;color:var(--muted);max-width:930px}.scope{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0 34px}.scope span{padding:7px 10px;border-radius:99px;background:#eef9f1;border:1px solid #bad2c3;color:var(--green);font-size:13px;font-weight:700}.scope .out{background:#f0ede6;border-color:#d7d1c3;color:#776f64;text-decoration:line-through}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{position:relative;display:block;cursor:pointer;padding:22px;border:1px solid var(--line);border-radius:18px;background:var(--card);box-shadow:0 18px 54px rgba(23,35,31,.1);transition:.18s;min-height:520px}.card:hover{transform:translateY(-3px)}input{position:absolute;opacity:0}.card:has(input:checked){outline:3px solid var(--green);background:#f6fff9}.tag{display:inline-block;padding:6px 9px;border-radius:99px;background:#e7e4dc;color:var(--muted);font-size:12px;font-weight:700}.rec{background:#d8eee1;color:var(--green)}h2{font-size:22px;margin:16px 0 8px}.desc{color:var(--muted);line-height:1.55;min-height:76px}.track{margin:20px 0}.step{position:relative;margin:0 0 10px;padding:12px 12px 12px 42px;border-radius:11px;background:#f0ede5;font-size:13px;line-height:1.45}.step b{display:block;margin-bottom:3px}.num{position:absolute;left:11px;top:12px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:#fff;font-size:11px;font-weight:800}.risk{margin-top:18px;padding-top:13px;border-top:1px solid var(--line);font-size:13px;color:var(--red);line-height:1.55}.value{margin-top:10px;font-size:13px;color:var(--green);font-weight:700}.principle{margin-top:30px;padding:20px;border-left:5px solid var(--green);background:#eef8f1;line-height:1.65}.answer{position:sticky;bottom:14px;margin-top:22px;padding:15px 18px;border-radius:14px;background:var(--ink);color:#fff;display:flex;justify-content:space-between;gap:12px;box-shadow:0 16px 46px rgba(23,35,31,.25)}.answer strong{color:#bde9cf}@media(max-width:840px){.grid{grid-template-columns:1fr}.card{min-height:0}.desc{min-height:0}.answer{flex-direction:column}}</style></head>
<body><main><div class="eyebrow">Decision 04 · roadmap shape</div><h1>本地个人版，先做什么才不会走偏？</h1><p class="lead">三种方案最终都能覆盖功能、代码解析、界面和 CLI/MCP；区别在于价值何时被验证，以及错误假设会累积多久。</p>
<div class="scope"><span>个人开发者</span><span>单机完整运行</span><span>真实仓库验证</span><span>Web + CLI + MCP</span><span class="out">云服务</span><span class="out">多租户</span><span class="out">本地云端同步</span></div>
<section class="grid">
<label class="card"><input name="shape" type="radio" value="技术串行"><span class="tag">risk first</span><h2>A. 先证明技术，再做产品</h2><div class="desc">先修解析、跑完真实实验和性能测试，所有技术指标达标后才重做用户体验。</div><div class="track"><div class="step"><i class="num">1</i><b>解析可靠性</b>替换或隔离上游故障</div><div class="step"><i class="num">2</i><b>M8 实验</b>真实仓库 A/B 与质量基线</div><div class="step"><i class="num">3</i><b>产品 Beta</b>安装、建库、浏览、Ask</div><div class="step"><i class="num">4</i><b>Agent 端面</b>CLI / MCP 收口</div></div><div class="value">优点：核心风险暴露最早。</div><div class="risk">问题：很长时间只有工程能力，没有可用产品，体验反馈来得太晚。</div></label>
<label class="card"><input name="shape" type="radio" value="体验串行"><span class="tag">demo first</span><h2>B. 先做体验，再补可信度</h2><div class="desc">先做完整本地应用和精致页面，再用真实仓库、评测和错误恢复填实底层。</div><div class="track"><div class="step"><i class="num">1</i><b>本地应用壳</b>首页、向导和任务中心</div><div class="step"><i class="num">2</i><b>知识阅读</b>Wiki、Ask、引用交互</div><div class="step"><i class="num">3</i><b>解析加固</b>真实语言和大仓测试</div><div class="step"><i class="num">4</i><b>M8 实验</b>最后验证实际收益</div></div><div class="value">优点：最快得到可展示的产品。</div><div class="risk">问题：容易把不可靠的底层包装得很好，后续返工信息架构与状态模型。</div></label>
<label class="card"><input name="shape" type="radio" value="垂直切片" checked><span class="tag rec">推荐</span><h2>C. 可信垂直切片</h2><div class="desc">每个里程碑同时交付一个真实仓库能力、一段完整用户旅程和一组可复现实验。</div><div class="track"><div class="step"><i class="num">1</i><b>可安装、可诊断</b>安装向导 + 预检 + 真实解析 smoke</div><div class="step"><i class="num">2</i><b>可建库、可审计</b>后台任务 + Claim 证据 + 失败恢复</div><div class="step"><i class="num">3</i><b>可理解、可查询</b>新版 Wiki + Ask + 源码跳转</div><div class="step"><i class="num">4</i><b>可量化、可交给 Agent</b>M8 A/B + CLI/MCP 一致性</div></div><div class="value">优点：A+B 真正并行，每一步都能被用户验证。</div><div class="risk">代价：每个里程碑需要跨解析、后端、界面与测试协同，边界必须严格。</div></label>
</section><div class="principle"><b>推荐 C 的退出规则：</b>每个里程碑必须在至少一个非本项目的真实仓库上完成端到端演示，并留下机器可读结果、用户可见状态和回归测试；否则不能只凭单元测试宣布完成。</div><div class="answer"><span>当前选择：<strong id="choice">C. 可信垂直切片</strong></span><span>请回到对话回复 A、B 或 C</span></div>
</main><script>const m={"技术串行":"A. 先证明技术，再做产品","体验串行":"B. 先做体验，再补可信度","垂直切片":"C. 可信垂直切片"};document.querySelectorAll('input').forEach(x=>x.onchange=()=>document.querySelector('#choice').textContent=m[x.value]);</script></body></html>
