[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "knowledge-compiler"
version = "0.1.0.dev0"
requires-python = ">=3.12"
dependencies = [
  "litellm>=1.98,<2",
  "pydantic>=2.10,<3",
  "pyyaml>=6.0,<7",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "codewiki>=0.6,<0.7",
  "mcp>=1.0,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6.0,<7",
]

[project.scripts]
knowledge = "knowledge_compiler.cli:app"
knowledge-mcp = "knowledge_compiler.mcp_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_compiler"]

