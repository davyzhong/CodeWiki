  # T02 三秒价值主张
  - id: T02
    score: 5
    reason: >-
      frontmatter description 完整给出定位与核心区分：Evidence ≠ Knowledge ≠ Context，
      并说明机制（把 git 仓库里的可验证事实编译成证据绑定、随提交过期的结构化知识，
